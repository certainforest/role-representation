[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utils"
version = "0.0.1"
dependencies = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.4",
    "jupyterlab-widgets>=3.0.16",
    "matplotlib>=3.10.8",
    "nnsight>=0.5.15",
    "openai>=2.21.0",
    "openrouter>=0.6.0",
    "pandas>=3.0.1",
    "plotly>=6.5.2",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
]

[tool.setuptools.packages.find]
where = ["."]
